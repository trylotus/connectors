syntax = "proto3";

package xo;

import "google/protobuf/timestamp.proto";
import "lotus/lotus.proto";

option go_package = "github.com/trylotus/connectors/xo/x/xo";

message PaidDM {
  option (lotus.composite).index = {
    unique: true
    fields: [
      "block_hash",
      "log_index",
      "ts"
    ]
  };

  google.protobuf.Timestamp ts = 1;
  uint64 block_number = 2 [(lotus.index) = {}];
  bytes block_hash = 3 [(lotus.bytes) = {format: FORMAT_TYPE_HEX}]; // Hash
  bytes tx_hash = 4 [
    (lotus.bytes) = {format: FORMAT_TYPE_HEX},
    (lotus.index) = {}
  ]; // Hash
  uint64 log_index = 5;
  bytes user_id = 6 [(lotus.bytes).format = FORMAT_TYPE_HEX]; // Hash
  bytes denom = 7 [(lotus.bytes).format = FORMAT_TYPE_HEX]; // Hash
  string amount = 8 [(lotus.numeric) = {}]; // uint256
}

