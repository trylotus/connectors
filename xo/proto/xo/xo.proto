syntax = "proto3";

package xo;

import "google/protobuf/timestamp.proto";
import "lotus/lotus.proto";

option go_package = "github.com/trylotus/connectors/xo/xo";


message PaidDM {
  option (lotus.composite).index = {
    unique: true
    fields: [
      "ts",
      "block_number",
      "log_index"
    ]
  };

  google.protobuf.Timestamp ts = 1;
  uint64 block_number = 2 [(lotus.index) = {}];
  bytes tx_hash = 3 [
    (lotus.bytes).format = FORMAT_TYPE_HEX,
    (lotus.index) = {}
  ]; // Hash
  uint64 log_index = 4;
  bytes user_id = 5 [(lotus.bytes).format = FORMAT_TYPE_HEX]; // Hash
  bytes denom = 6 [(lotus.bytes).format = FORMAT_TYPE_HEX]; // Hash
  string amount = 7 [(lotus.numeric) = {precision: 78}]; // uint256
}

