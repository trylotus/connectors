  bytes from = 7 [(lotus.bytes) = {format: FORMAT_TYPE_HEX}]; // Address
  bytes to = 8 [(lotus.bytes) = {format: FORMAT_TYPE_HEX}]; // Address
  string value = 9 [(lotus.numeric) = {}];
}
