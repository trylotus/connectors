syntax = "proto3";

package pair;

import "google/protobuf/timestamp.proto";
import "lotus/lotus.proto";

option go_package = "github.com/trylotus/connectors/pancakeswapv2/pair";

message Approval {
  option (lotus.composite).index = {
    unique: true
    type: INDEX_TYPE_ORDERED
    fields: [
      "block_hash",
      "log_index",
      "ts"
    ]
  };

  google.protobuf.Timestamp ts = 1;
  uint64 block_number = 2 [(lotus.index) = {type: INDEX_TYPE_ORDERED}];
  bytes block_hash = 3 [(lotus.bytes) = {format: FORMAT_TYPE_HEX}]; // Hash
  bytes tx_hash = 4 [
    (lotus.bytes) = {format: FORMAT_TYPE_HEX},
    (lotus.index) = {type: INDEX_TYPE_ORDERED}
  ]; // Hash
  uint64 log_index = 5;
  bytes pair = 6 [(lotus.bytes) = {format: FORMAT_TYPE_HEX}]; // Address
  bytes owner = 7 [(lotus.bytes) = {format: FORMAT_TYPE_HEX}]; // Address
  bytes spender = 8 [(lotus.bytes) = {format: FORMAT_TYPE_HEX}]; // Address
  string value = 9 [(lotus.numeric) = {}];
}

