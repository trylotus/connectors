  uint64 block_number = 2 [(lotus.index) = {type: INDEX_TYPE_ORDERED}];
  bytes block_hash = 3 [(lotus.bytes) = {format: FORMAT_TYPE_HEX}]; // Hash
  bytes tx_hash = 4 [
    (lotus.bytes) = {format: FORMAT_TYPE_HEX},
    (lotus.index) = {type: INDEX_TYPE_ORDERED}
  ]; // Hash
  uint64 log_index = 5;
  bytes pair = 6 [(lotus.bytes) = {format: FORMAT_TYPE_HEX}]; // Address
  bytes sender = 7 [(lotus.bytes) = {format: FORMAT_TYPE_HEX}]; // Address
  string amount0 = 8 [(lotus.numeric) = {}];
  string amount1 = 9 [(lotus.numeric) = {}];
  bytes to = 10 [(lotus.bytes) = {format: FORMAT_TYPE_HEX}]; // Address
}

