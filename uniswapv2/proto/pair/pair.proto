message Trade5min {
  option (lotus.view) = {
    topic: "lotus.uniswapv2.0_0_0.pair_Swap"
    materialized: true
    refresh_interval: '5 min'
    options: ["timescaledb.continuous"]
    group_by: [
      "t",
      "pair"
    ]
    where: "(amount0_in + amount0_out) > 0"
  };

  option (lotus.composite).index = {
    fields: [
      "pair",
      "t"
    ]
  };

  google.protobuf.Timestamp t = 1 [(lotus.projection) = "time_bucket('5 min', ts)"];
  bytes pair = 2 [
    (lotus.projection) = "pair",
    (lotus.bytes) = {format: FORMAT_TYPE_HEX}
  ];
  string open_price = 3 [
    (lotus.projection) = "first((amount1_in + amount1_out) / (amount0_in + amount0_out), ts)",
    (lotus.numeric) = {}
  ];
  string high_price = 4 [
    (lotus.projection) = "max((amount1_in + amount1_out) / (amount0_in + amount0_out))",
    (lotus.numeric) = {}
  ];
  string low_price = 5 [
    (lotus.projection) = "min((amount1_in + amount1_out) / (amount0_in + amount0_out))",
    (lotus.numeric) = {}
  ];
  string close_price = 6 [
    (lotus.projection) = "last((amount1_in + amount1_out) / (amount0_in + amount0_out), ts)",
    (lotus.numeric) = {}
  ];
  int64 makers = 7 [(lotus.projection) = "count(distinct sender)"];
  int64 txns_buy = 8 [(lotus.projection) = "sum(case when amount0_out > 0 then 1 else 0 end)"];
  int64 txns_sell = 9 [(lotus.projection) = "sum(case when amount0_in > 0 then 1 else 0 end)"];
  string volume0_buy = 10 [
    (lotus.projection) = "sum(amount0_out)",
    (lotus.numeric) = {}
  ];
  string volume0_sell = 11 [
    (lotus.projection) = "sum(amount0_in)",
    (lotus.numeric) = {}
  ];
  string volume1_buy = 12 [
    (lotus.projection) = "sum(amount1_out)",
    (lotus.numeric) = {}
  ];
  string volume1_sell = 13 [
    (lotus.projection) = "sum(amount1_in)",
    (lotus.numeric) = {}
  ];
}

