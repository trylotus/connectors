message Trade1min {
  option (lotus.view) = {
    topic: "lotus.uniswapv3.0_0_0.pool_Swap"
    materialized: true
    refresh_interval: '1 min'
    options: ["timescaledb.continuous"]
    group_by: [
      "t",
      "pool"
    ]
    where: "amount0 > 0"
  };

  option (lotus.composite).index = {
    fields: [
      "pool",
      "t"
    ]
  };

  google.protobuf.Timestamp t = 1 [(lotus.projection) = "time_bucket('1 min', ts)"];
  bytes pool = 2 [
    (lotus.projection) = "pool",
    (lotus.bytes) = {format: FORMAT_TYPE_HEX}
  ];
  string open_price = 3 [
    (lotus.projection) = "first(abs(amount1) / abs(amount0), ts)",
    (lotus.numeric) = {}
  ];
  string high_price = 4 [
    (lotus.projection) = "max(abs(amount1) / abs(amount0))",
    (lotus.numeric) = {}
  ];
  string low_price = 5 [
    (lotus.projection) = "min(abs(amount1) / abs(amount0))",
    (lotus.numeric) = {}
  ];
  string close_price = 6 [
    (lotus.projection) = "last(abs(amount1) / abs(amount0), ts)",
    (lotus.numeric) = {}
  ];
  int64 makers = 7 [(lotus.projection) = "count(distinct sender)"];
  int64 txns_buy = 8 [(lotus.projection) = "sum(case when amount0 < 0 then 1 else 0 end)"];
  int64 txns_sell = 9 [(lotus.projection) = "sum(case when amount0 > 0 then 1 else 0 end)"];
  string volume0_buy = 10 [
    (lotus.projection) = "sum(case when amount0 < 0 then -amount0 else 0 end)",
    (lotus.numeric) = {}
  ];
  string volume0_sell = 11 [
    (lotus.projection) = "sum(case when amount0 > 0 then amount0 else 0 end)",
    (lotus.numeric) = {}
  ];
  string volume1_buy = 12 [
    (lotus.projection) = "sum(case when amount1 < 0 then -amount1 else 0 end)",
    (lotus.numeric) = {}
  ];
  string volume1_sell = 13 [
    (lotus.projection) = "sum(case when amount1 > 0 then amount1 else 0 end)",
    (lotus.numeric) = {}
  ];
}

